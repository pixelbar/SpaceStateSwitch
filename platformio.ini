; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:SpaceStateSwitch]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
upload_speed = 921600 ; The upload baud rate
monitor_speed = 115200 ; The serial (monitor) baud rate
lib_deps = 
	me-no-dev/AsyncTCP@1.1.1
	https://github.com/me-no-dev/ESPAsyncWebServer.git#f71e3d4
    https://github.com/tzapu/WiFiManager.git#88c378f
	bblanchon/ArduinoJson@^6.19.4
	adafruit/Adafruit NeoPixel@^1.10.5
	knolleary/PubSubClient@^2.8
	khoih-prog/ESP_DoubleResetDetector@^1.3.2
