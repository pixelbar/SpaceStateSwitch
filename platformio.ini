; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = SpaceStateSwitch

[env:SpaceStateSwitch]
; The official PlatformIO espressif32 platform is stuck on Arduino-ESP32 2.x.
; pioarduino is the community-maintained platform that tracks the current
; Arduino-ESP32 3.x releases (ESP-IDF 5.x). Pinned for reproducible builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = wemos_d1_mini32
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Two 1.9MB OTA app slots (the default table only has 1.25MB slots, which is
; too tight for an Arduino 3.x + TLS build). NVS lives at the same offset as in
; the default table, so WiFi / MQTT settings survive the switch.
; NOTE: partition tables cannot be changed over OTA, the first flash after this
; change must be done over USB.
board_build.partitions = min_spiffs.csv

; Public key used to verify OTA firmware signatures. See README.md.
board_build.embed_txtfiles = keys/ota_signing_key.pub.pem

; Sets FIRMWARE_VERSION from the FIRMWARE_VERSION environment variable (CI) or
; "dev" for local builds.
extra_scripts = pre:scripts/firmware_version.py

build_flags =
	-DUPDATE_SIGN          ; Enable signature verification in the Update library
	-DCORE_DEBUG_LEVEL=3   ; Info level logging (log_i / log_w / log_e)
build_src_flags =
	-Wall -Wextra

lib_deps =
	esp32async/AsyncTCP@^3.5.0
	esp32async/ESPAsyncWebServer@^3.12.1
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.3
	adafruit/Adafruit NeoPixel@^1.15.5
